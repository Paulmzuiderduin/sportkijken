name: Update Sports TV Guide Data

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Refresh, test and build sports events
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test data pipeline
        run: npm run test:data

      - name: Load last deployed dataset as fallback
        run: npm run data:hydrate

      - name: Refresh events dataset
        run: npm run data:update

      - name: Stamp successful source check
        run: |
          printf '{\n  "checkedAt": "%s"\n}\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > src/data/source-check.nl.json

      - name: Build deployable site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy refreshed site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
